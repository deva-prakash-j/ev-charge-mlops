[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evcharge"
version = "0.1.0"
description = "Drift-aware MLOps pipeline for EV charge-session prediction"
requires-python = ">=3.11"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "prometheus-client>=0.20,<1",
]
dev = [
    "ruff>=0.14,<1",
]
orchestration = [
    "prefect>=3.0,<4",
]
monitoring = [
    "evidently>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Great Expectations 0.18 pulls in deprecated marshmallow/pyparsing calls.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*Number.*field should not be instantiated.*:UserWarning",
]
