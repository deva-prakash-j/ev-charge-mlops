services:
  mlflow:
    build: .
    image: ${EVCHARGE_IMAGE:-evcharge-capstone:local}
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
    ports:
      - "127.0.0.1:${EVCHARGE_MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  bootstrap:
    build: .
    image: ${EVCHARGE_IMAGE:-evcharge-capstone:local}
    command: ["python", "scripts/bootstrap_registry.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: ${EVCHARGE_IMAGE:-evcharge-capstone:local}
    command:
      - uvicorn
      - evcharge.serve.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      EVCHARGE_MODEL_NAME: evcharge-sample-energy
      EVCHARGE_PREDICTION_LOG: /var/log/evcharge/predictions.jsonl
    ports:
      - "127.0.0.1:${EVCHARGE_API_PORT:-8000}:8000"
    volumes:
      - prediction_logs:/var/log/evcharge
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.10.0
    command:
      - --web.listen-address=:9091
      - --persistence.file=/pushgateway/persisted-metrics
    ports:
      - "127.0.0.1:${EVCHARGE_PUSHGATEWAY_PORT:-9091}:9091"
    volumes:
      - pushgateway_data:/pushgateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:${EVCHARGE_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      pushgateway:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${EVCHARGE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  mlflow_data:
  prediction_logs:
  pushgateway_data:
  prometheus_data:
  grafana_data:
